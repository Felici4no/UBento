[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ubento"
version = "0.1.0"
description = "UBento — finanças pessoais em um painel só, para desktop."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "pydantic>=2.7",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "pyinstaller>=6"]

[project.gui-scripts]
ubento = "ubento.__main__:main"

[project.scripts]
ubento-mcp = "ubento.mcp_local:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
